anslateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(6,13,22,.96);border-top:1px solid #213348;backdrop-filter:blur(20px)}.nav-button{display:grid;place-items:center;gap:5px;min-height:44px;color:#768b9f;border:0;background:transparent;font-size:9px;letter-spacing:.08em}.nav-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.nav-button[aria-current=page]{color:var(--cyan)}.nav-button[aria-current=page]::before{content:"";position:absolute;top:0;width:22px;height:2px;background:var(--cyan)}[hidden]{display:none!important}.view{animation:arrive .18s ease-out}.ledger-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 25px}.ledger-tile{border:1px solid var(--line);background:var(--panel);padding:17px 14px;border-radius:10px}.ledger-tile .stat-value{font-size:19px}.ledger-entry{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.ledger-entry .race-name{font-size:13px}.empty{padding:30px 12px;text-align:center;font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;line-height:1.8}.sheet-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,4,10,.75);backdrop-filter:blur(5px)}.sheet{width:100%;max-width:480px;max-height:90svh;overflow:auto;border-radius:22px 22px 0 0;border:1px solid #2a4055;background:#0a131f;padding:12px 22px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}.handle{width:34px;height:3px;border-radius:3px;background:#354b60;margin:0 auto 17px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet-head h2{font-size:23px;letter-spacing:.04em;margin:0}.close{border:1px solid var(--line);background:none;border-radius:50%;width:44px;height:44px;font- <script>
(()=>{'use strict';
const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),signed=n=>(n>0?'+':n<0?'−':'')+yen(Math.abs(Number(n||0))),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mq=matchMedia('(min-width:900px)');
let data=null,venue='all',current='overview',origin='loading',focused=null,refreshing=false;
const combo=k=>'<span class="combo" aria-label="'+esc(String(k).split('').join('-'))+'">'+String(k).split('').map(n=>'<span class="boat b'+esc(n)+'">'+esc(n)+'</span>').join('')+'</span>';
const rows=()=>(data?.races||[]).filter(r=>!r.obs).sort((a,b)=>String(b.deadline).localeCompare(String(a.deadline))||a.id.localeCompare(b.id));
const bought=r=>(r.bets||[]).length>0;
const raceStake=r=>(r.bets||[]).reduce((sum,b)=>sum+Number(b.stake||0),0);
const kumiKey=k=>String(k??'').replace(/[^1-6]/g,'');
const hasResult=r=>bought(r)&&r.pnl!==null&&r.pnl!==undefined&&Number.isFinite(Number(r.pnl))&&Boolean(r.settled||kumiKey(r.win).length===3);
const didHit=r=>kumiKey(r.win).length===3&&(r.bets||[]).some(b=>kumiKey(b.k)===kumiKey(r.win));
function tag(r){if(r.verdict==='withdrawal_skip')return ['欠場・見送り','withdrawal'];if(r.verdict==='missing_processing_record')return ['処理記録なし','warn'];if(bought(r)){if(hasResult(r))return [didHit(r)?'的中':Number(r.pnl)<0?'不的中':'結果あり',didHit(r)?'hit':Number(r.pnl)<0?'miss':'bought'];return ['購入済み・結果待ち','pending']}if(/error|blocked|mismatch|missing/.test(r.verdict||''))return ['要確認','warn'];if(r.verdict==='pending_submission'||(r.planned_bets||[]).length)return ['購入確認待ち','pending'];return ['見送り',''];}
function outcome(r){const win=kumiKey(r.win),result=win.length===3?'<div class="result-combination"><span>結果の出目</span>'+combo(win)+'</div>':'';if(!bought(r))return result;const stake=raceStake(r);if(!hasResult(r))return '<div class="race-outcome waiting">'+result+'<strong>'+(result?'払戻・収支の確認待ち':'結果待ち')+'</strong><span>購入 '+yen(stake)+' · 払戻・収支は未確定</span></div>';const pnl=Number(r.pnl),payout=stake+pnl;return '<div class="race-outcome '+(pnl>0?'positive':pnl<0?'negative':'')+'">'+result+'<strong>'+ (pnl>0?signed(pnl)+' のプラス':pnl<0?signed(pnl)+' のマイナス':'収支 ¥0')+'</strong><span>購入 '+yen(stake)+' ／ 払戻 '+yen(payout)+(r.prov&&!r.settled?' · 暫定':'')+'</span></div>';}
function plot(chartId){const settled=rows().filter(r=>r.pnl!==null&&r.pnl!==undefined&&Number.isFinite(Number(r.pnl))).reverse();let sum=0;const vals=[0,...settled.map(r=>sum+=Number(r.pnl))];if(vals.length<2)return '<div class="chart"><div class="empty" style="padding:19px;border:0">精算後に推移を表示します</div></div>';
 const lo=Math.min(...vals,0),hi=Math.max(...vals,1),y=v=>70-(v-lo)/(hi-lo)*57,x=i=>i/(vals.length-1)*310;const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' '),color=sum>=0?'#66e4ad':'#ff858b';return '<div class="chart"><svg viewBox="0 0 310 82" preserveAspectRatio="none" role="img" aria-label="精算レースの累計損益"><defs><linearGradient id="fill-'+chartId+'" x1="0" y1="0" x2="0" y2="1"><stop stop-color="'+color+'" stop-opacity=".13"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><path d="M0 '+y(0)+'H310" stroke="#314353" stroke-dasharray="3 4" stroke-width=".7"/><polygon points="0,82 '+pts+' 310,82" fill="url(#fill-'+chartId+')"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.7" vector-effect="non-scaling-stroke"/><circle cx="310" cy="'+y(sum)+'" r="2.8" fill="'+color+'"/></svg></div><div class="chart-times"><span>'+esc(settled[0].deadline)+'</span><span>精算レースの累計</span><span>'+esc(settled.at(-1).deadline)+'</span></div>'}
function summary(chartId){const t=data.total||{},profit=Number(t.pnl||0);return '<div class="summary"><div class="summary-label"><span>本日の損益（精算分）</span><span class="live-status"><span class="dot"></span>'+ (origin==='live'?'LIVE':'更新待ち')+'</span></div><div class="pnl '+(profit>=0?'positive':'negative')+'"><span class="currency">'+(profit>0?'+':profit<0?'−':'')+'¥</span>'+Math.abs(profit).toLocaleString('ja-JP')+'</div><div class="summary-caption">'+Number(data.n_bet_races||0)+'レース購入 · '+Number(data.n_bet_tickets||0)+'枚'+(data.races.some(r=>r.prov)?' · 暫定集計を含む':'')+'</div>'+plot(chartId)+'<div class="stats"><div class="stat"><div class="stat-label">精算分の購入額</div><div class="stat-value">'+yen(t.stake)+'</div></div><div class="stat"><div class="stat-label">払戻</div><div class="stat-value">'+yen(t.payout)+'</div></div></div></div>'}
function venueButtons(){const venues=[...new Map((data.schedule||[]).map(r=>[r.jcd,r.v])).entries()];$('venue-count').textContent=venues.length+' VENUES';const html='<button type="button" class="venue" data-venue="all" aria-pressed="'+(venue==='all')+'">すべて<span class="tiny">'+venues.length+'</span></button>'+venues.map(([id,name])=>'<button type="button" class="venue" data-venue="'+esc(id)+'" aria-pressed="'+(venue===id)+'">'+esc(name)+'</button>').join('');$('venues-overview').innerHTML=html;$('venues-races').innerHTML=html;}
function card(r,i){const [label,kind]=tag(r),bs=r.bets||[];return '<button type="button" class="race-card '+(i===0&&bought(r)?'featured':'')+'" data-race="'+esc(r.id)+'"><div class="race-top"><div><div class="race-name">'+esc(r.venue)+'<span class="rno">'+Number(r.rno)+'R</span></div><div class="race-time">締切 '+esc(r.deadline)+'</div></div><span class="tag '+kind+'">'+label+'</span></div><div class="race-bottom">'+(bs.length?'<div class="combos">'+bs.map(b=>combo(b.k)).join('')+'</div><span class="stake">'+yen(bs.reduce((a,b)=>a+Number(b.stake||0),0))+'<span class="chevron">›</span></span>':'<span class="card-note">'+(kind==='withdrawal'?'欠場あり・推論記録なし':kind==='warn'?'記録を確認':kind==='pending'?'候補あり・購入確認待ち':'購入条件に該当せず')+'</span><span class="chevron">›</span>')+'</div>'+outcome(r)+'</button>'}
function render(){if(!data)return;const date=String(data.date);$('date').textContent=date.slice(0,4)+'.'+date.slice(4,6)+'.'+date.slice(6);$('summary').innerHTML=summary('overview');const sys=data.sys||{},fresh=origin==='live';$('health').innerHTML=[['入力準備',sys.morning?.ok,sys.morning?.ok?'準備済み':'確認中'],['予測',fresh&&Number.isFinite(sys.infer_age_min),!fresh?'更新待ち':Number.isFinite(sys.infer_age_min)?sys.infer_age_min+'分前':'未更新'],['投票',fresh&&sys.bet?.ok,!fresh?'更新待ち':sys.bet?.ok?'稼働中':'確認中']].map(([name,ok,value])=>'<div class="health-item '+(ok?'':'warn')+'"><i></i>'+name+' <span class="mono">'+esc(value)+'</span></div>').join('');venueButtons();const all=rows().filter(r=>venue==='all'||r.id.split('_')[1]===venue);$('recent-races').innerHTML=all.slice(0,4).map(card).join('')||'<div class="empty">この場の記録はまだありません</div>';$('all-races').innerHTML=all.map(card).join('')||'<div class="empty">この場の記録はまだありません</div>';$('race-count').innerHTML='<span><b>'+Number(data.n_processed||0)+'</b>処理済み</span><span><b>'+Number(data.n_scheduled||0)+'</b>対象</span><span><b>'+Number(data.n_bet_races||0)+'</b>購入</span>';$('ledger-summary').innerHTML=summary('ledger')+'<div class="ledger-grid"><div class="ledger-tile"><div class="stat-label">購入レース</div><div class="stat-value">'+Number(data.n_bet_races||0)+'<small>レース</small></div></div><div class="ledger-tile"><div class="stat-label">的中</div><div class="stat-value">'+Number(data.total?.hits||0)+'<small>レース</small></div></div></div>';$('ledger-entries').innerHTML=rows().filter(r=>hasResult(r)).map(r=>'<div class="ledger-entry"><div><div class="race-name">'+esc(r.venue)+' '+Number(r.rno)+'R</div><div class="race-time">'+esc(r.deadline)+' · '+tag(r)[0]+(r.prov&&!r.settled?' · 暫定':'')+'</div></div><div class="mono '+(r.pnl>=0?'positive':'negative')+'">'+signed(r.pnl)+'</div></div>').join('')||'<div class="empty">精算が済んだレースをここに表示します</div>';document.querySelector('.footer-note').hidden=false;document.querySelector('main.mobile').setAttribute('aria-busy','false');$('updated').textContent='集計時刻 '+data.generated_at;$('data-origin').textContent=origin==='live'?'実投票の購入記録と精算データを表示しています。':'直前に取得できた集計を表示しています。';}
function tab(name){if(!['overview','races','ledger'].includes(name))return;current=name;['overview','races','ledger'].forEach(id=>$(id).hidden=id!==name);document.querySelectorAll('.nav-button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===name?'page':'false'));$('page-heading').textContent={overview:'今日の運用',races:'レース一覧',ledger:'本日の収支'}[name];render();window.scrollTo({top:0,behavior:'auto'})}
function venueVideo(r){
 const jcd=String((data.schedule||[]).find(x=>x.id===r.id)?.jcd||r.id.split('_')[1]||'').padStart(2,'0');
 if(!/^\d{2}$/.test(jcd)||Number(jcd)<1||Number(jcd)>24)return '';
 const url='https://race.boatcast.jp/?jo='+encodeURIComponent(jcd);
 return '<section class="venue-video" data-jcd="'+esc(jcd)+'" data-name="'+esc(r.venue)+'"><div class="video-head"><h3>'+esc(r.venue)+' · 現在のライブ映像</h3><a href="'+url+'" target="_blank" rel="noopener noreferrer">公式で開く ↗</a></div><p class="video-note">公式BOATCASTの現在の配信です。レース詳細とは映像の対象レースが異なる場合があります。</p><button type="button" class="video-start" data-video-open><span class="play-circle" aria-hidden="true">▶</span><span>ライブ映像を表示</span><small>タップして公式プレーヤーを読み込みます</small></button><div class="video-host" hidden></div><div class="video-controls" hidden><small>再生できないときは「公式で開く」へ。<br>公式ページ内で再生ボタンを押してください。</small><button type="button" class="video-stop" data-video-stop>映像を閉じる</button></div></section>';
}
function loadVenueVideo(button){
 if($('sheet-overlay').hidden)return;
 const box=button.closest('.venue-video'),host=box.querySelector('.video-host');
 if(host.querySelector('iframe'))return;
 const frame=document.createElement('iframe');
 frame.title=box.dataset.name+'の現在のライブ映像（BOATCAST）';
 frame.src='https://race.boatcast.jp/?jo='+encodeURIComponent(box.dataset.jcd);
 frame.allow='autoplay; fullscreen; picture-in-picture';
 frame.allowFullscreen=true;
 frame.referrerPolicy='strict-origin-when-cross-origin';
 button.hidden=true;host.hidden=false;host.append(frame);box.querySelector('.video-controls').hidden=false;
 frame.scrollIntoView({block:'nearest',behavior:'auto'});
}
function stopVenueVideo(box){
 box.querySelectorAll('iframe').forEach(frame=>{frame.src='about:blank';frame.remove()});
 box.querySelector('.video-host').hidden=true;
 box.querySelector('.video-start').hidden=false;
 box.querySelector('.video-controls').hidden=true;
}
const predictionSorts=[['ev_desc','EV↓'],['ev_asc','EV↑'],['p_desc','推論↓'],['p_asc','推論↑'],['m_desc','市場↓'],['m_asc','市場↑'],['k_asc','組番↑'],['k_desc','組番↓']];
const predictionState={sort:'p_desc',first:'0',second:'0'};
let predictionRace=null;
const kumis=[];for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)for(let c=1;c<=6;c++)if(a!==b&&a!==c&&b!==c)kumis.push(''+a+b+c);
function predictionRows(r){
 const d=r.detail||{},complete=Array.isArray(d.p120)&&d.p120.length===120;
 const value=x=>typeof x==='number'&&Number.isFinite(x)?x:null;
 const boughtSet=new Set((r.bets||[]).map(b=>String(b.k))),plan=new Set((r.planned_bets||[]).map(b=>String(b.k)));
 const entries=complete?kumis.map((k,i)=>({k,p:value(d.p120[i]),m:value(d.m120?.[i]),o:value(d.o120?.[i])})):(r.top||d.t5||[]).map(t=>({k:String(t.k),p:value(t.p),m:null,o:null}));
 return entries.map(t=>({...t,ev:t.p!==null&&t.o!==null?t.p*t.o:null,bought:boughtSet.has(t.k),planned:plan.has(t.k)}));
}
function predictionPanel(r){
 predictionRace=r;
 const hasAll=Array.isArray(r.detail?.p120)&&r.detail.p120.length===120;
 const filter=(key,label)=>'<label>'+label+'<select data-pred-filter="'+key+'" aria-label="'+label+'の艇番"><option value="0">全</option>'+[1,2,3,4,5,6].map(n=>'<option value="'+n+'"'+(predictionState[key]===String(n)?' selected':'')+'>'+n+'</option>').join('')+'</select></label>';
 return '<section class="sheet-section" id="predictions"><h3>3連単 · '+(hasAll?'全120通り':'取得できた予測')+'</h3>'+
 '<p class="pred-note">推論＝モデルの出現確率、市場＝T−4オッズの逆数を正規化した出現確率。EV＝推論確率 × T−4オッズ。掛金に使う予測価格とは別です。</p>'+
 (!hasAll?'<p class="pred-note">このレースには120通りのデータがありません。取得できた予測をすべて表示します。未取得の値は「—」です。</p>':'')+
 '<div class="pred-sort" role="group" aria-label="予測の並べ替え">'+predictionSorts.map(([key,label])=>'<button type="button" data-pred-sort="'+key+'" aria-pressed="'+(predictionState.sort===key)+'">'+label+'</button>').join('')+'</div>'+
 '<div class="pred-filter">'+filter('first','1着')+filter('second','2着')+'</div><p class="pred-count" id="prediction-count" role="status"></p><div id="prediction-list"></div></section>';
}
function renderPredictions(){
 if(!predictionRace)return;
 const all=predictionRows(predictionRace),shown=all.filter(t=>(predictionState.first==='0'||t.k[0]===predictionState.first)&&(predictionState.second==='0'||t.k[1]===predictionState.second));
 const [field,order]=predictionState.sort.split('_'),dir=order==='asc'?1:-1;
 shown.sort((a,b)=>{const x=field==='k'?Number(a.k):a[field],y=field==='k'?Number(b.k):b[field];return x===null&&y===null?a.k.localeCompare(b.k):x===null?1:y===null?-1:dir*(x-y)||a.k.localeCompare(b.k)});
 $('prediction-count').textContent=shown.length+' / '+all.length+'通り'+(shown.length?' · 省略なし':' · 該当する組み合わせはありません');
 const fmt=(v,type)=>v===null?'—':type==='pct'?(v*100).toFixed(2)+'%':type==='odds'?v.toFixed(1)+'倍':v.toFixed(2);
 $('prediction-list').innerHTML=shown.map((t,i)=>'<div class="pred-row" data-kumi="'+esc(t.k)+'"><div class="pred-row-head"><span class="pred-rank">'+(i+1)+'</span>'+combo(t.k)+(t.bought?'<span class="pred-mark">購入済み</span>':t.planned?'<span class="pred-mark planned">候補・未購入</span>':'')+'</div><dl class="pred-metrics"><div><dt>EV</dt><dd class="'+(t.ev!==null&&t.ev>=1.1?'edge':'')+'">'+fmt(t.ev)+'</dd></div><div><dt>T−4</dt><dd>'+fmt(t.o,'odds')+'</dd></div><div><dt>推論</dt><dd>'+fmt(t.p,'pct')+'</dd></div><div><dt>市場</dt><dd>'+fmt(t.m,'pct')+'</dd></div></dl></div>').join('');
 document.querySelectorAll('[data-pred-sort]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.predSort===predictionState.sort));
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pred-sort]');if(b){predictionState.sort=b.dataset.predSort;renderPredictions()}});
document.addEventListener('change',e=>{const key=e.target.dataset.predFilter;if(key==='first'||key==='second'){predictionState[key]=e.target.value;renderPredictions()}});
function openRace(id){
 const r=rows().find(r=>r.id===id);if(!r)return;
 focused=document.activeElement;
 document.querySelectorAll('.venue-video').forEach(stopVenueVideo);
 const bs=r.bets||[],[label,kind]=tag(r);
 $('sheet-title').textContent=r.venue+' '+r.rno+'R';
 $('sheet-content').innerHTML=
 '<div class="sheet-summary"><span class="tag '+kind+'">'+label+'</span><span class="mono">'+(bs.length?yen(bs.reduce((a,b)=>a+Number(b.stake||0),0)):'—')+'</span></div>'+
 outcome(r)+'<div class="sheet-context">締切 '+esc(r.deadline)+' · '+esc(data.date.slice(0,4)+'/'+data.date.slice(4,6)+'/'+data.date.slice(6))+'</div>'+
 (r.skip_reason?'<div class="sheet-context">'+esc(r.skip_reason)+'</div>':'')+
 venueVideo(r)+
 '<div class="sheet-section"><h3>購入した買い目 · '+bs.length+'枚</h3>'+
 (bs.length?bs.map(b=>'<div class="ticket-row">'+combo(b.k)+'<div style="text-align:right"><span class="mono">'+yen(b.stake)+'</span><br><small>参考オッズ '+Number(b.o||0).toFixed(1)+'倍</small></div></div>').join(''):'<div class="empty">このレースの購入はありません</div>')+'</div>'+
 predictionPanel(r)+
 (r.settled?'<div class="sheet-context">'+(r.prov?'暫定の':'')+'損益 '+signed(r.pnl)+(r.win?' · 結果 '+esc(String(r.win).split('').join('−')):'')+'</div>':'');
 renderPredictions();
 $('sheet-overlay').hidden=false;document.body.style.overflow='hidden';document.querySelector('.sheet').scrollTop=0;document.querySelector('.sheet').focus();
}
function closeSheet(){if($('sheet-overlay').hidden)return;document.querySelectorAll('.venue-video').forEach(stopVenueVideo);$('sheet-overlay').hidden=true;document.body.style.overflow='';focused?.focus();}
document.addEventListener('click',e=>{if(e.target.closest('[data-retry]'))refresh();const vo=e.target.closest('[data-video-open]');if(vo)loadVenueVideo(vo);const vs=e.target.closest('[data-video-stop]');if(vs)stopVenueVideo(vs.closest('.venue-video'));const t=e.target.closest('[data-tab]');if(t)tab(t.dataset.tab);const v=e.target.closest('[data-venue]');if(v){venue=v.dataset.venue;const scrollers=[...document.querySelectorAll('.venues')].map(a=>a.scrollLeft);render();document.querySelectorAll('.venues').forEach((a,i)=>a.scrollLeft=scrollers[i])}const r=e.target.closest('[data-race]');if(r)openRace(r.dataset.race);if(e.target===$('sheet-overlay')||e.target.closest('.close'))closeSheet()});
document.addEventListener('keydown',e=>{if($('sheet-overlay').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const items=[...document.querySelectorAll('.sheet button,.sheet select,.sheet [href],.sheet iframe,.sheet [tabindex="0"]')];if(!items.length)return;const visible=items.filter(x=>x.getClientRects().length);if(!visible.length)return;const first=visible[0],last=visible.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===document.querySelector('.sheet'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function layout(){
 if(mq.matches){
  closeSheet();
  if(!$('desktop-frame').getAttribute('src'))$('desktop-frame').src='/desktop.html';
 }else{
  $('desktop-frame').removeAttribute('src');
  refresh();
 }
}
function isStale(next){
 const raw=String(next.generated_at||'').replace(' ','T');
 const timestamp=Date.parse(raw+(/(?:Z|[+-]\d{2}:?\d{2})$/.test(raw)?'':'+09:00'));
 return !Number.isFinite(timestamp)||Date.now()-timestamp>300000;
}
async function refresh(){
 if(mq.matches||document.hidden||refreshing)return;
 refreshing=true;
 try{
  const response=await fetch('/data/live_today.json',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const next=await response.json();
  if(!Array.isArray(next.races)||!Array.isArray(next.schedule)||!/^\d{8}$/.test(String(next.date))||!next.total||!['stake','payout','pnl'].every(k=>typeof next.total[k]==='number'&&Number.isFinite(next.total[k])))throw Error('Invalid live data');
  const stale=isStale(next);
  data=next;origin=stale?'stale':'live';
  $('data-message').textContent=stale?'データの更新が止まっています。最終集計 '+next.generated_at:'';
  $('data-message').hidden=!stale;
  render();
 }catch(e){
  origin='stale';
  $('data-message').textContent=data?'更新を取得できません。直前の集計を表示しています。':'運用データを取得できません。しばらくしてから再取得してください。';
  $('data-message').hidden=false;
  if(data){render()}else{
   $('summary').innerHTML='<div class="empty">データがまだ表示できません<br><button type="button" class="text-button" data-retry>再取得する ↻</button></div>';
   document.querySelector('main.mobile').setAttribute('aria-busy','false');
  }
 }finally{refreshing=false}
}
mq.addEventListener('change',layout);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!mq.matches)refresh()});
layout();setInterval(refresh,20000);
})();
</script>
